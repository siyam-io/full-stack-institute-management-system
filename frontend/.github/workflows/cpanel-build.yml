name: Build and Package for cPanel

on:
  push:
    branches:
      - main
      - master
  pull_request:
    branches:
      - main
      - master

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Clean Build Artifacts
        run: rm -rf node_modules .next

      - name: Install Dependencies
        run: npm install

      - name: Build Next.js App
        run: npm run build
        env:
          NEXT_PUBLIC_SITE_URL: ${{ secrets.NEXT_PUBLIC_SITE_URL }}
          NEXT_PUBLIC_TURNSTILE_SITE_KEY: ${{ secrets.NEXT_PUBLIC_TURNSTILE_SITE_KEY }}
          NEXT_PUBLIC_GTM_ID: ${{ secrets.NEXT_PUBLIC_GTM_ID }}
          META_PIXEL_ID: ${{ secrets.META_PIXEL_ID }}

      - name: Create cPanel Bundle
        run: |
          # Copy public assets and static files into standalone
          mkdir -p .next/standalone/.next/static
          mkdir -p .next/standalone/public
          mkdir -p .next/standalone/content

          cp -r public/* .next/standalone/public/ 2>/dev/null || true
          cp -r .next/static/* .next/standalone/.next/static/ 2>/dev/null || true
          cp -r content/* .next/standalone/content/ 2>/dev/null || true

          # Inject the custom env loader into server.js
          cat << 'EOF' > .next/standalone/server_env_loader.js
          // Custom Env Loader injected by build script
          (function() {
            const fs = require("fs");
            const path = require("path");
            const envFiles = [".env", ".env.local"];
            for (const file of envFiles) {
              const envPath = path.join(__dirname, file);
              if (fs.existsSync(envPath)) {
                console.log("[Env Loader] Loading variables from " + file);
                try {
                  const content = fs.readFileSync(envPath, "utf8");
                  const lines = content.split(/\r?\n/);
                  for (const line of lines) {
                    const trimmed = line.trim();
                    if (!trimmed || trimmed.startsWith("#")) continue;
                    const equalIndex = trimmed.indexOf("=");
                    if (equalIndex === -1) continue;
                    const key = trimmed.slice(0, equalIndex).trim();
                    let val = trimmed.slice(equalIndex + 1).trim();
                    if ((val.startsWith('"') && val.endsWith('"')) || (val.startsWith("'") && val.endsWith("'"))) {
                      val = val.slice(1, -1);
                    }
                    val = val.replace(/\\n/g, "\n");
                    process.env[key] = val;
                  }
                } catch (err) {
                  console.error("[Env Loader] Error loading " + file + ":", err);
                }
              }
            }
          })();
          EOF

          # Prepend loader to server.js
          cat .next/standalone/server.js >> .next/standalone/server_env_loader.js
          mv .next/standalone/server_env_loader.js .next/standalone/server.js

          # Create deployment zip
          cd .next/standalone
          zip -r ../../deploy_cpanel.zip . 2>/dev/null
        shell: bash

      - name: Upload cPanel ZIP Artifact
        continue-on-error: true
        uses: actions/upload-artifact@v4
        with:
          name: deploy_cpanel
          path: deploy_cpanel.zip
          retention-days: 14
          if-no-files-found: warn
