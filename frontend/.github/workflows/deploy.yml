name: CI/CD Pipeline

on:
  push:
    branches:
      - main

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci

      - name: Build Application
        run: npm run build
        env:
          NEXT_PUBLIC_SITE_URL: ${{ secrets.NEXT_PUBLIC_SITE_URL }}
          NEXT_PUBLIC_TURNSTILE_SITE_KEY: ${{ secrets.NEXT_PUBLIC_TURNSTILE_SITE_KEY }}
          NEXT_PUBLIC_GTM_ID: ${{ secrets.NEXT_PUBLIC_GTM_ID }}
          META_PIXEL_ID: ${{ secrets.META_PIXEL_ID }}

      - name: Validate Schemas
        run: node scripts/verify_schemas.js

      - name: Run Lead Monitor Alerts (Dry Run)
        run: node scripts/check_leads.js

      # NOTE: The PowerShell bundling step (cpanel_bundle.ps1) is a Windows-only
      # script and must be run locally before uploading to cPanel.
      # This CI job packages the build output for download; run cpanel_bundle.ps1
      # locally after downloading this artifact to create the final deploy zip.
      - name: Upload Build Artifact for cPanel Deployment
        continue-on-error: true
        uses: actions/upload-artifact@v4
        with:
          name: cib-build
          path: |
            .next/
            public/
            content/
            package.json
            package-lock.json
            next.config.mjs
            cpanel_bundle.ps1
          retention-days: 14
          if-no-files-found: warn
