<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0a1628"/>
      <stop offset="100%" style="stop-color:#1a2a4a"/>
    </linearGradient>
    <linearGradient id="hatGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#ffffff"/>
      <stop offset="100%" style="stop-color:#e8e8e8"/>
    </linearGradient>
    <linearGradient id="brim" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#f5c842"/>
      <stop offset="100%" style="stop-color:#e6a800"/>
    </linearGradient>
  </defs>

  <!-- Background circle -->
  <rect width="64" height="64" rx="14" fill="url(#bg)"/>

  <!-- Chef hat puff (top dome) -->
  <ellipse cx="32" cy="24" rx="13" ry="11" fill="url(#hatGrad)"/>

  <!-- Hat body / column -->
  <rect x="21" y="28" width="22" height="14" rx="2" fill="url(#hatGrad)"/>

  <!-- Gold brim band -->
  <rect x="19" y="40" width="26" height="5" rx="2.5" fill="url(#brim)"/>

  <!-- Subtle crease lines on dome for depth -->
  <line x1="32" y1="14" x2="32" y2="24" stroke="#d0d0d0" stroke-width="0.8" stroke-linecap="round" opacity="0.5"/>
  <line x1="25" y1="17" x2="27" y2="26" stroke="#d0d0d0" stroke-width="0.6" stroke-linecap="round" opacity="0.4"/>
  <line x1="39" y1="17" x2="37" y2="26" stroke="#d0d0d0" stroke-width="0.6" stroke-linecap="round" opacity="0.4"/>
</svg>
