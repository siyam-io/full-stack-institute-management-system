<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 50" fill="none">
  <!-- Culinary Icon Emblem -->
  <g transform="translate(4, 5)">
    <circle cx="20" cy="20" r="19" stroke="url(#goldGrad)" stroke-width="1.5" fill="none" opacity="0.6"/>
    <circle cx="20" cy="20" r="16" fill="#111" stroke="#333" stroke-width="0.5"/>
    <!-- Chef Hat -->
    <path d="M14 26h12v-1.5c0-.8-.7-1.5-1.5-1.5h-9c-.8 0-1.5.7-1.5 1.5V26z" fill="#FFD700"/>
    <path d="M12.5 22.5c-.8 0-1.5-.7-1.5-1.5 0-1.1.9-2 2-2 .2 0 .5.1.7.2.4-1.3 1.6-2.2 3-2.2.8 0 1.5.3 2 1 .5-.7 1.2-1 2-1 1.4 0 2.6.9 3 2.2.2-.1.5-.2.7-.2 1.1 0 2 .9 2 2 0 .8-.7 1.5-1.5 1.5H12.5z" fill="#FFF"/>
    <!-- Crossed Whisks/Knife subtle detail -->
    <path d="M17 28.5l6-6M23 28.5l-6-6" stroke="#EF233C" stroke-width="0.8" stroke-linecap="round"/>
  </g>
  
  <!-- Brand Typography -->
  <g transform="translate(52, 10)">
    <text x="0" y="16" font-family="system-ui, -apple-system, sans-serif" font-size="16" font-weight="900" letter-spacing="2.5" fill="#FFFFFF">CULINARY</text>
    <text x="0" y="30" font-family="system-ui, -apple-system, sans-serif" font-size="10.5" font-weight="700" letter-spacing="4.5" fill="#FFD700">ACADEMY</text>
  </g>

  <!-- Gradients -->
  <defs>
    <linearGradient id="goldGrad" x1="0" y1="0" x2="40" y2="40" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#FFD700"/>
      <stop offset="50%" stop-color="#FFA500"/>
      <stop offset="100%" stop-color="#EF233C"/>
    </linearGradient>
  </defs>
</svg>
