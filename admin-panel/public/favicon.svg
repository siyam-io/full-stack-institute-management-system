<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#141419"/>
      <stop offset="100%" stop-color="#09090c"/>
    </linearGradient>
    <linearGradient id="ringGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFD700"/>
      <stop offset="60%" stop-color="#FFA500"/>
      <stop offset="100%" stop-color="#EF233C"/>
    </linearGradient>
    <linearGradient id="goldBrim" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#FFD700"/>
      <stop offset="100%" stop-color="#F59E0B"/>
    </linearGradient>
  </defs>

  <!-- Background container with rounded corners -->
  <rect width="64" height="64" rx="16" fill="url(#bgGrad)"/>
  
  <!-- Outer subtle glowing ring -->
  <rect x="2" y="2" width="60" height="60" rx="14" fill="none" stroke="url(#ringGrad)" stroke-width="2" opacity="0.95"/>

  <!-- Chef Hat Emblem -->
  <g transform="translate(32, 33)">
    <!-- Center top dome puff -->
    <circle cx="0" cy="-13" r="10" fill="#FFFFFF"/>
    <!-- Left dome puff -->
    <circle cx="-9" cy="-8" r="8.5" fill="#F4F4F5"/>
    <!-- Right dome puff -->
    <circle cx="9" cy="-8" r="8.5" fill="#F4F4F5"/>

    <!-- Hat Body / Column -->
    <path d="M-11 -4 H11 L9 7 H-9 Z" fill="#FFFFFF"/>
    
    <!-- Hat Gold Brim -->
    <rect x="-12" y="6" width="24" height="5.5" rx="2.5" fill="url(#goldBrim)"/>

    <!-- Accent red star/dot on brim -->
    <circle cx="0" cy="8.75" r="1.3" fill="#EF233C"/>

    <!-- Crossed styling under brim -->
    <path d="M-6 13 L6 17 M6 13 L-6 17" stroke="#EF233C" stroke-width="1.2" stroke-linecap="round"/>
  </g>
</svg>
